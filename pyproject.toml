[project]
name = "awr1843-ddm-host"
version = "0.1.0"
description = "Host tools for the AWR1843AOP DDM-MIMO firmware: configure the radar and decode its output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pyserial>=3.5",
    "xwr>=0.5.1",
]

[project.scripts]
ddm = "ddm.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "ruff>=0.6",
]

[tool.uv.build-backend]
module-name = "ddm"
module-root = "host"

[tool.ruff]
line-length = 110
src = ["host"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["test"]
