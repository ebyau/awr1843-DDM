[project]
name = "awr1843-ddm-host"
version = "0.1.0"
description = "Host tools for the AWR1843AOP DDM-MIMO firmware: configure the radar and decode its output"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pyserial>=3.5",
    "xwr>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
src = ["host"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["host"]
