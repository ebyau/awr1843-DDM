# Radar settings. Check them with: uv run ddm cfg profiles/<name>.toml
# Every key, limit and formula: docs/configuration.md#profiles

[chirp]
start_ghz = 77
idle_us = 100
adc_start_us = 5.7
ramp_end_us = 59
tx_start_us = 1
slope_mhz_per_us = 67.012
samples = 256
sample_rate_ksps = 5000
rx_gain_db = 30

[mimo]
tdm = false         # true = TI's TDM (one TX per chirp) instead of DDM
bands = 4           # DDM sub-bands: 4, 8 or 16 (divides 64, more than 3 TX); ignored if tdm = true

[frame]
loops = 32          # chirps per frame = loops x bands (DDM) or x 3 TX (TDM)
period_ms = 125     # frame period (ms); frames/s = 1000 / period_ms
