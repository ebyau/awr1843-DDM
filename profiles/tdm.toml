# points.toml in TI's time-division MIMO, for comparing the same scene with and without DDM.
extends = "points.toml"
description = """
TDM-MIMO, AWR1843AOP: the chirp of points.toml with one TX per chirp (TX0, TX1, TX2), 96 chirps/frame.
The Doppler window is TI's profile_3d_aop.cfg: velocity is unambiguous to about +-6.9 m/s.
"""

[mimo]
tdm = true

[cfar]
doppler_mps = [-7.06, 12]
